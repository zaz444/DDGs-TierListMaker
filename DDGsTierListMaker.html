<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DDGs TierListMaker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a2e;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    color: #fff;
  }

  /* HEADER */
  #header {
    background: #0f0f23;
    border-bottom: 3px solid #444;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  #header h1 {
    font-family: Impact, Arial Black, sans-serif;
    font-size: 22px;
    color: #ffcc00;
    letter-spacing: 1px;
    text-shadow: 2px 2px 0 #000;
    text-transform: uppercase;
  }

  #header span {
    font-size: 11px;
    color: #888;
    font-style: italic;
  }

  /* TOOLBAR */
  #toolbar {
    background: #222;
    border-bottom: 2px solid #444;
    padding: 8px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }

  .btn {
    background: #3a3a3a;
    color: #fff;
    border: 2px solid #666;
    padding: 6px 12px;
    font-size: 12px;
    font-family: Arial, sans-serif;
    cursor: pointer;
    border-radius: 3px;
    font-weight: bold;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .btn:hover { background: #555; border-color: #aaa; }
  .btn:active { background: #222; }

  .btn-green { background: #2a5a2a; border-color: #4a8a4a; }
  .btn-green:hover { background: #3a7a3a; }

  .btn-blue { background: #1a3a6a; border-color: #3a6aaa; }
  .btn-blue:hover { background: #2a4a8a; }



  .btn-yellow { background: #5a4a00; border-color: #aaaa00; color: #ffee00; }
  .btn-yellow:hover { background: #7a6a00; }

  #item-name-input {
    background: #111;
    border: 2px solid #555;
    color: #fff;
    padding: 6px 10px;
    font-size: 13px;
    border-radius: 3px;
    width: 160px;
    font-family: Arial, sans-serif;
  }
  #item-name-input:focus { outline: none; border-color: #ffcc00; }

  /* MAIN LAYOUT */
  #main {
    display: flex;
    gap: 0;
    padding: 12px;
    flex-direction: column;
  }

  /* TIER ROWS */
  #tier-list {
    width: 100%;
  }

  .tier-row {
    display: flex;
    align-items: stretch;
    border: 2px solid #444;
    border-bottom: none;
    min-height: 80px;
  }
  .tier-row:last-child { border-bottom: 2px solid #444; }

  .tier-label {
    width: 56px;
    min-width: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Impact, Arial Black, sans-serif;
    font-size: 32px;
    font-weight: bold;
    text-shadow: 2px 2px 0 #000;
    border-right: 2px solid #444;
    cursor: pointer;
    user-select: none;
    flex-shrink: 0;
  }

  .tier-label:hover { filter: brightness(1.2); }

  .tier-S .tier-label { background: #ff7f7f; color: #fff; }
  .tier-A .tier-label { background: #ffbf7f; color: #fff; }
  .tier-B .tier-label { background: #bfbf00; color: #fff; }
  .tier-C .tier-label { background: #3a8a3a; color: #fff; }
  .tier-D .tier-label { background: #7fbfff; color: #fff; }
  .tier-F .tier-label { background: #bf7fff; color: #fff; }

  .tier-items {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    align-content: flex-start;
    gap: 4px;
    padding: 4px;
    background: #2a2a2a;
    min-height: 80px;
  }

  .tier-items.drag-over {
    background: #3a3a4a;
  }

  /* ITEMS */
  .item {
    width: 72px;
    height: 72px;
    background: #444;
    border: 2px solid #666;
    border-radius: 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: grab;
    position: relative;
    overflow: hidden;
    text-align: center;
    user-select: none;
    flex-shrink: 0;
    touch-action: none;
  }

  .item:active { cursor: grabbing; border-color: #ffcc00; }
  .item.dragging { opacity: 0.4; border-color: #ffcc00; }
  .item.touch-dragging { opacity: 0.9; position: fixed; z-index: 9999; pointer-events: none; border-color: #ffcc00; }

  .item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .item-text-label {
    font-size: 11px;
    font-weight: bold;
    color: #fff;
    text-shadow: 1px 1px 0 #000;
    padding: 2px 4px;
    word-break: break-word;
    line-height: 1.2;
    max-height: 68px;
    overflow: hidden;
  }

  .item-img-label {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.65);
    font-size: 9px;
    color: #fff;
    padding: 2px 3px;
    text-align: center;
    word-break: break-word;
    line-height: 1.2;
    display: none;
  }

  .item:hover .item-img-label { display: block; }

  .item-delete {
    position: absolute;
    top: 1px; right: 2px;
    font-size: 12px;
    color: #f00;
    cursor: pointer;
    display: none;
    font-weight: bold;
    line-height: 1;
    text-shadow: 0 0 2px #000;
    z-index: 10;
  }
  .item:hover .item-delete { display: block; }

  /* UNRANKED POOL */
  #pool-section {
    margin-top: 12px;
    border: 2px solid #444;
    background: #1e1e1e;
  }

  #pool-header {
    background: #333;
    border-bottom: 2px solid #444;
    padding: 6px 10px;
    font-size: 13px;
    font-weight: bold;
    color: #ccc;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-family: Arial Black, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #pool-items {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 6px;
    min-height: 90px;
    background: #1e1e1e;
  }

  #pool-items.drag-over {
    background: #2a2a3a;
  }

  /* MODAL */
  #modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  #modal-overlay.open { display: flex; }

  #modal {
    background: #222;
    border: 3px solid #555;
    border-radius: 4px;
    padding: 20px;
    width: 90%;
    max-width: 340px;
    position: relative;
  }

  #modal h2 {
    font-family: Impact, sans-serif;
    font-size: 18px;
    color: #ffcc00;
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  #modal label {
    display: block;
    font-size: 12px;
    color: #aaa;
    margin-bottom: 4px;
    font-weight: bold;
    text-transform: uppercase;
  }

  #modal input[type="text"] {
    width: 100%;
    background: #111;
    border: 2px solid #555;
    color: #fff;
    padding: 7px 10px;
    font-size: 13px;
    border-radius: 3px;
    font-family: Arial, sans-serif;
    margin-bottom: 12px;
  }
  #modal input[type="text"]:focus { outline: none; border-color: #ffcc00; }

  #modal-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

  /* LABEL EDIT MODAL */
  #label-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 1001;
    align-items: center;
    justify-content: center;
  }
  #label-modal-overlay.open { display: flex; }
  #label-modal {
    background: #222;
    border: 3px solid #555;
    border-radius: 4px;
    padding: 20px;
    width: 90%;
    max-width: 280px;
  }
  #label-modal h2 {
    font-family: Impact, sans-serif;
    font-size: 16px;
    color: #ffcc00;
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  #label-modal input {
    width: 100%;
    background: #111;
    border: 2px solid #555;
    color: #fff;
    padding: 7px 10px;
    font-size: 20px;
    font-family: Impact, sans-serif;
    border-radius: 3px;
    margin-bottom: 12px;
    text-align: center;
  }
  #label-modal input:focus { outline: none; border-color: #ffcc00; }
  #label-modal-actions { display: flex; gap: 8px; }

  /* CONTEXT MENU */
  #ctx-menu {
    display: none;
    position: fixed;
    background: #222;
    border: 2px solid #555;
    border-radius: 3px;
    z-index: 2000;
    min-width: 140px;
    overflow: hidden;
  }
  #ctx-menu.open { display: block; }
  .ctx-item {
    padding: 8px 14px;
    font-size: 12px;
    cursor: pointer;
    color: #ddd;
    border-bottom: 1px solid #333;
    font-weight: bold;
    text-transform: uppercase;
  }
  .ctx-item:last-child { border-bottom: none; }
  .ctx-item:hover { background: #3a3a3a; color: #fff; }
  .ctx-item.danger { color: #ff6666; }
  .ctx-item.danger:hover { background: #4a1a1a; }



  /* TOAST */
  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #ffcc00;
    border: 2px solid #555;
    padding: 8px 18px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 3px;
    z-index: 3000;
    display: none;
    font-family: Arial Black, sans-serif;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* TRASH */
  #trash-zone {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 64px;
    height: 64px;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    border-radius: 4px;
    border: 2px solid #666;
    background: #2a2a2a;
    cursor: default;
  }
  #trash-zone.active { display: flex; }
  #trash-zone.hot { border-color: #cc2222; background: #3a1a1a; }
  #trash-zone svg { pointer-events: none; }
  #trash-zone.hot svg .trash-body { stroke: #ff4444; }
  #trash-zone.hot svg .trash-lid { stroke: #ff4444; }

  /* TRASH CAN */
  #trash-btn {
    width: 32px;
    height: 32px;
    background: transparent;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    border-radius: 3px;
    padding: 2px;
  }
  #trash-btn.hot {
    background: #4a0000;
  }
  #trash-btn svg {
    width: 22px;
    height: 22px;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="header">
  <div>
    <h1>DDGs TierListMaker</h1>

  </div>
</div>

<div id="toolbar">
  <button class="btn btn-green" onclick="openAddModal()">+ Add Item</button>
  <button class="btn btn-blue" onclick="document.getElementById('img-upload').click()">+ Add Image</button>
  <input type="file" id="img-upload" accept="image/*" multiple style="display:none" onchange="handleImageUpload(event)">
  <button class="btn btn-yellow" onclick="clearAll()">Clear All</button>

</div>

<div id="main">
  <div id="tier-list">
    <div class="tier-row tier-S" data-tier="S">
      <div class="tier-label" onclick="openLabelModal(this)" title="Click to rename">S</div>
      <div class="tier-items" data-tier="S"></div>
    </div>
    <div class="tier-row tier-A" data-tier="A">
      <div class="tier-label" onclick="openLabelModal(this)" title="Click to rename">A</div>
      <div class="tier-items" data-tier="A"></div>
    </div>
    <div class="tier-row tier-B" data-tier="B">
      <div class="tier-label" onclick="openLabelModal(this)" title="Click to rename">B</div>
      <div class="tier-items" data-tier="B"></div>
    </div>
    <div class="tier-row tier-C" data-tier="C">
      <div class="tier-label" onclick="openLabelModal(this)" title="Click to rename">C</div>
      <div class="tier-items" data-tier="C"></div>
    </div>
    <div class="tier-row tier-D" data-tier="D">
      <div class="tier-label" onclick="openLabelModal(this)" title="Click to rename">D</div>
      <div class="tier-items" data-tier="D"></div>
    </div>
    <div class="tier-row tier-F" data-tier="F">
      <div class="tier-label" onclick="openLabelModal(this)" title="Click to rename">F</div>
      <div class="tier-items" data-tier="F"></div>
    </div>
  </div>

  <div id="pool-section">
    <div id="pool-header"><span>Unranked Items</span>
      <div id="trash-btn">
        <svg id="trash-closed" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="6" width="18" height="2" rx="1" fill="#aaa"/>
          <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" stroke="#aaa" stroke-width="1.5" fill="none"/>
          <rect x="5" y="8" width="14" height="13" rx="1" fill="none" stroke="#aaa" stroke-width="1.5"/>
          <line x1="9" y1="11" x2="9" y2="18" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="12" y1="11" x2="12" y2="18" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="15" y1="11" x2="15" y2="18" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <svg id="trash-open" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none">
          <path d="M5 5 L9 2 L15 4 L19 2" stroke="#ff4444" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <rect x="5" y="6" width="14" height="15" rx="1" fill="none" stroke="#ff4444" stroke-width="1.5"/>
          <line x1="9" y1="9" x2="9" y2="18" stroke="#ff4444" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="12" y1="9" x2="12" y2="18" stroke="#ff4444" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="15" y1="9" x2="15" y2="18" stroke="#ff4444" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <div id="pool-items" data-tier="pool"></div>
  </div>
</div>



<!-- ADD ITEM MODAL -->
<div id="modal-overlay" onclick="closeModal(event)">
  <div id="modal">
    <h2>Add New Item</h2>
    <label>Item Name</label>
    <input type="text" id="new-item-name" placeholder="Insert stuff here" maxlength="30" onkeydown="if(event.key==='Enter')addTextItem()">
    <div id="modal-actions">
      <button class="btn btn-green" onclick="addTextItem()">+ Add Text</button>
      <button class="btn btn-blue" onclick="document.getElementById('img-upload-modal').click()">+ Add Image</button>
      <input type="file" id="img-upload-modal" accept="image/*" multiple style="display:none" onchange="handleImageUpload(event);closeModalDirect()">
      <button class="btn" onclick="closeModalDirect()">Cancel</button>
    </div>
  </div>
</div>

<!-- LABEL EDIT MODAL -->
<div id="label-modal-overlay" onclick="closeLabelModal(event)">
  <div id="label-modal">
    <h2>Rename Tier</h2>
    <input type="text" id="label-input" maxlength="4" onkeydown="if(event.key==='Enter')saveLabelModal()">
    <div id="label-modal-actions">
      <button class="btn btn-green" onclick="saveLabelModal()">Save</button>
      <button class="btn" onclick="closeLabelModalDirect()">Cancel</button>
    </div>
  </div>
</div>

<!-- CONTEXT MENU -->
<div id="ctx-menu">
  <div class="ctx-item" id="ctx-move-s" onclick="ctxMoveTo('S')">Move to S</div>
  <div class="ctx-item" id="ctx-move-a" onclick="ctxMoveTo('A')">Move to A</div>
  <div class="ctx-item" id="ctx-move-b" onclick="ctxMoveTo('B')">Move to B</div>
  <div class="ctx-item" id="ctx-move-c" onclick="ctxMoveTo('C')">Move to C</div>
  <div class="ctx-item" id="ctx-move-d" onclick="ctxMoveTo('D')">Move to D</div>
  <div class="ctx-item" id="ctx-move-f" onclick="ctxMoveTo('F')">Move to F</div>
  <div class="ctx-item" onclick="ctxMoveTo('pool')">Unrank</div>
  <div class="ctx-item danger" onclick="ctxDelete()">Delete</div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
let dragSrc = null;
let ctxTarget = null;
let editLabelEl = null;
let touchDragEl = null;
let touchClone = null;
let touchOffX = 0, touchOffY = 0;
let itemIdCounter = 0;

function makeId() { return 'item-' + (++itemIdCounter); }

/* ---- ITEM CREATION ---- */
function createItem(label, imgSrc) {
  const el = document.createElement('div');
  el.className = 'item';
  el.draggable = true;
  el.dataset.id = makeId();

  if (imgSrc) {
    const img = document.createElement('img');
    img.src = imgSrc;
    img.draggable = false;
    el.appendChild(img);
    if (label) {
      const lbl = document.createElement('div');
      lbl.className = 'item-img-label';
      lbl.textContent = label;
      el.appendChild(lbl);
    }
  } else {
    const lbl = document.createElement('div');
    lbl.className = 'item-text-label';
    lbl.textContent = label;
    el.appendChild(lbl);
  }

  const del = document.createElement('span');
  del.className = 'item-delete';
  del.innerHTML = '&#10005;';
  del.title = 'Remove';
  del.onclick = (e) => { e.stopPropagation(); el.remove(); showToast('Item removed'); };
  el.appendChild(del);

  /* Desktop drag */
  el.addEventListener('dragstart', onDragStart);
  el.addEventListener('dragend', onDragEnd);

  /* Right-click context menu */
  el.addEventListener('contextmenu', (e) => { e.preventDefault(); openCtxMenu(e, el); });

  /* Touch drag */
  el.addEventListener('touchstart', onTouchStart, { passive: false });

  return el;
}

function addTextItem() {
  const input = document.getElementById('new-item-name');
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  const item = createItem(name, null);
  document.getElementById('pool-items').appendChild(item);
  input.value = '';
  closeModalDirect();
  showToast('Item added!');
}

function handleImageUpload(e) {
  const files = Array.from(e.target.files);
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const name = file.name.replace(/\.[^.]+$/, '');
      const item = createItem(name, ev.target.result);
      document.getElementById('pool-items').appendChild(item);
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
  if (files.length) showToast(files.length + ' image(s) added!');
}

/* ---- DRAG & DROP (desktop) ---- */
function onDragStart(e) {
  dragSrc = this;
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  setTrashHot(true);
}
function onDragEnd() {
  setTrashHot(false);
  if (dragSrc) dragSrc.classList.remove('dragging');
  dragSrc = null;
  document.querySelectorAll('.tier-items, #pool-items').forEach(z => z.classList.remove('drag-over'));
}

function setTrashHot(on) {
  const btn = document.getElementById('trash-btn');
  const closed = document.getElementById('trash-closed');
  const open = document.getElementById('trash-open');
  if (on) {
    btn.classList.add('hot');
    closed.style.display = 'none';
    open.style.display = '';
  } else {
    btn.classList.remove('hot');
    closed.style.display = '';
    open.style.display = 'none';
  }
}

const trashBtn = document.getElementById('trash-btn');
trashBtn.addEventListener('dragover', e => { e.preventDefault(); });
trashBtn.addEventListener('drop', e => {
  e.preventDefault();
  if (dragSrc) { dragSrc.remove(); dragSrc = null; showToast('Item deleted'); }
  setTrashHot(false);
});

document.querySelectorAll('.tier-items, #pool-items').forEach(zone => {
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', e => { if (!zone.contains(e.relatedTarget)) zone.classList.remove('drag-over'); });
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    if (dragSrc && dragSrc.parentNode !== zone) {
      zone.appendChild(dragSrc);
    } else if (dragSrc) {
      const afterEl = getDragAfterElement(zone, e.clientX);
      if (afterEl == null) zone.appendChild(dragSrc);
      else zone.insertBefore(dragSrc, afterEl);
    }
  });
});

function getDragAfterElement(container, x) {
  const els = [...container.querySelectorAll('.item:not(.dragging)')];
  return els.reduce((closest, el) => {
    const box = el.getBoundingClientRect();
    const offset = x - box.left - box.width / 2;
    if (offset < 0 && offset > closest.offset) return { offset, el };
    return closest;
  }, { offset: Number.NEGATIVE_INFINITY }).el;
}

/* ---- TOUCH DRAG ---- */
function onTouchStart(e) {
  if (e.touches.length !== 1) return;
  e.preventDefault();
  touchDragEl = this;
  const t = e.touches[0];
  const rect = touchDragEl.getBoundingClientRect();
  touchOffX = t.clientX - rect.left;
  touchOffY = t.clientY - rect.top;

  touchClone = touchDragEl.cloneNode(true);
  touchClone.className = touchDragEl.className + ' touch-dragging';
  touchClone.style.width = rect.width + 'px';
  touchClone.style.height = rect.height + 'px';
  touchClone.style.left = (t.clientX - touchOffX) + 'px';
  touchClone.style.top = (t.clientY - touchOffY) + 'px';
  document.body.appendChild(touchClone);
  touchDragEl.classList.add('dragging');
  setTrashHot(true);

  document.addEventListener('touchmove', onTouchMove, { passive: false });
  document.addEventListener('touchend', onTouchEnd);
}

function onTouchMove(e) {
  if (!touchClone) return;
  e.preventDefault();
  const t = e.touches[0];
  touchClone.style.left = (t.clientX - touchOffX) + 'px';
  touchClone.style.top = (t.clientY - touchOffY) + 'px';

  document.querySelectorAll('.tier-items, #pool-items').forEach(z => z.classList.remove('drag-over'));
  const el = document.elementFromPoint(t.clientX, t.clientY);
  if (el) {
    const zone = el.closest('.tier-items, #pool-items');
    if (zone) zone.classList.add('drag-over');
  }
}

function onTouchEnd(e) {
  document.removeEventListener('touchmove', onTouchMove);
  document.removeEventListener('touchend', onTouchEnd);
  document.querySelectorAll('.tier-items, #pool-items').forEach(z => z.classList.remove('drag-over'));
  setTrashHot(false);

  if (touchClone) { touchClone.remove(); touchClone = null; }
  if (!touchDragEl) return;

  const t = e.changedTouches[0];
  touchDragEl.classList.remove('dragging');

  const el = document.elementFromPoint(t.clientX, t.clientY);
  if (el && el.closest('#trash-btn')) {
    touchDragEl.remove();
    showToast('Item deleted');
  } else if (el) {
    const zone = el.closest('.tier-items, #pool-items');
    if (zone) zone.appendChild(touchDragEl);
  }
  touchDragEl = null;
}

/* ---- CONTEXT MENU ---- */
function openCtxMenu(e, el) {
  ctxTarget = el;
  const menu = document.getElementById('ctx-menu');
  menu.classList.add('open');
  let x = e.clientX, y = e.clientY;
  if (x + 150 > window.innerWidth) x = window.innerWidth - 155;
  if (y + 250 > window.innerHeight) y = window.innerHeight - 255;
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
}

function ctxMoveTo(tier) {
  if (!ctxTarget) return;
  const zone = tier === 'pool'
    ? document.getElementById('pool-items')
    : document.querySelector(`.tier-items[data-tier="${tier}"]`);
  if (zone) zone.appendChild(ctxTarget);
  closeCtxMenu();
}

function ctxDelete() {
  if (ctxTarget) { ctxTarget.remove(); showToast('Item deleted'); }
  closeCtxMenu();
}

function closeCtxMenu() {
  document.getElementById('ctx-menu').classList.remove('open');
  ctxTarget = null;
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('#ctx-menu')) closeCtxMenu();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeCtxMenu(); closeModalDirect(); closeLabelModalDirect(); } });

/* ---- MODALS ---- */
function openAddModal() {
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('new-item-name').focus(), 50);
}
function closeModal(e) { if (e.target === document.getElementById('modal-overlay')) closeModalDirect(); }
function closeModalDirect() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('new-item-name').value = '';
}

function openLabelModal(labelEl) {
  editLabelEl = labelEl;
  document.getElementById('label-input').value = labelEl.textContent.trim();
  document.getElementById('label-modal-overlay').classList.add('open');
  setTimeout(() => { const i = document.getElementById('label-input'); i.focus(); i.select(); }, 50);
}
function closeLabelModal(e) { if (e.target === document.getElementById('label-modal-overlay')) closeLabelModalDirect(); }
function closeLabelModalDirect() { document.getElementById('label-modal-overlay').classList.remove('open'); editLabelEl = null; }
function saveLabelModal() {
  if (!editLabelEl) return;
  const val = document.getElementById('label-input').value.trim() || editLabelEl.textContent.trim();
  editLabelEl.textContent = val;
  closeLabelModalDirect();
  showToast('Tier renamed!');
}

/* ---- CLEAR ALL ---- */
function clearAll() {
  if (!confirm('Clear all items from the tier list?')) return;
  document.querySelectorAll('.tier-items, #pool-items').forEach(z => {
    [...z.querySelectorAll('.item')].forEach(i => i.remove());
  });
  showToast('Cleared!');
}



/* ---- TOAST ---- */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._to);
  t._to = setTimeout(() => { t.style.display = 'none'; }, 2000);
}


</script>
